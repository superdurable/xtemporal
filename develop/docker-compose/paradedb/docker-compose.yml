services:
  paradedb:
    image: paradedb/paradedb:v0.26.0-pg17
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: visibility
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visibility"]
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: visibility
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visibility"]
      interval: 2s
      timeout: 2s
      retries: 30
