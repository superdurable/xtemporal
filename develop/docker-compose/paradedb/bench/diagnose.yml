services:
  paradedb:
    image: paradedb/paradedb:${PARADEDB_TAG:-v0.26.0-pg17}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - log_min_messages=debug1
      - -c
      - log_error_verbosity=verbose
      - -c
      - log_line_prefix=%m [%p] %b %u@%d
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: visibility
      RUST_BACKTRACE: full
      RUST_LOG: debug
    ports:
      - "127.0.0.1:57434:5432"
    ulimits:
      core: -1
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visibility"]
      interval: 2s
      timeout: 2s
      retries: 30
