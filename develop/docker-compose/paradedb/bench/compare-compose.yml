services:
  db:
    image: ${BENCH_IMAGE:?BENCH_IMAGE is required}
    shm_size: 2gb
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=${BENCH_SHARED_BUFFERS:-8GB}", "-c", "effective_cache_size=${BENCH_EFFECTIVE_CACHE_SIZE:-24GB}", "-c", "work_mem=80MB", "-c", "maintenance_work_mem=2GB", "-c", "log_error_verbosity=verbose"]
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: visibility
      RUST_BACKTRACE: full
    ulimits:
      core: -1
    ports:
      - "127.0.0.1:${BENCH_PORT:-56640}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visibility"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
