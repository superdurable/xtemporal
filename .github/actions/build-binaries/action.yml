name: Build Dex Engine Server
description: Build the Temporal Server binary for the Dex Engine image.

inputs:
  single-arch:
    description: Build only one Linux architecture (amd64 or arm64)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Build temporal-server
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SINGLE_ARCH: ${{ inputs.single-arch }}
      run: |
        case "${SINGLE_ARCH}" in
          "") architectures=(amd64 arm64) ;;
          amd64|arm64) architectures=("${SINGLE_ARCH}") ;;
          *) echo "Unsupported architecture: ${SINGLE_ARCH}" >&2; exit 1 ;;
        esac

        for architecture in "${architectures[@]}"; do
          mkdir -p "docker/build/${architecture}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${architecture}" \
            go build -o "docker/build/${architecture}/temporal-server" ./cmd/server
        done
