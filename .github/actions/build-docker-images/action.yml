name: Build Dex Engine Image
description: Build and optionally publish the Dex Engine Server image.

inputs:
  push:
    description: Push the image to Docker Hub
    required: false
    default: "false"
  platform:
    description: Single platform to build, for example linux/amd64
    required: false
    default: ""
  load:
    description: Load a single-platform image into the local Docker daemon
    required: false
    default: "false"
  release-tag:
    description: Release Docker tag to publish in addition to the immutable SHA tag
    required: false
    default: ""
  dockerhub-username:
    description: Docker Hub username
    required: false
  dockerhub-token:
    description: Docker Hub token
    required: false

outputs:
  sha-full-tag:
    description: Immutable image tag for the current commit
    value: ${{ steps.image-tags.outputs.sha-full-tag }}

runs:
  using: composite
  steps:
    - name: Set image tags
      id: image-tags
      shell: bash
      run: echo "sha-full-tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Validate release tag
      if: inputs.release-tag != ''
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        if [[ ! "${RELEASE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Invalid Docker release tag: ${RELEASE_TAG}" >&2
          exit 1
        fi

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Build image
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        IMAGE_SHA_FULL_TAG: ${{ steps.image-tags.outputs.sha-full-tag }}
        IMAGE_RELEASE_TAG: ${{ inputs.release-tag }}
        PLATFORM: ${{ inputs.platform }}
        LOAD: ${{ inputs.load }}
        PUSH: ${{ inputs.push }}
        TEMPORAL_SHA: ${{ github.sha }}
      run: |
        bake_args=()
        if [[ "${PUSH}" == "true" ]]; then
          bake_args+=(--push)
        fi
        if [[ -n "${PLATFORM}" ]]; then
          bake_args+=(--set "*.platform=${PLATFORM}")
        fi
        if [[ "${LOAD}" == "true" ]]; then
          bake_args+=(--load)
        fi

        docker buildx bake "${bake_args[@]}" -f docker/docker-bake.hcl server
