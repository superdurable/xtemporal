name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  TEMPORAL_VERSION_CHECK_DISABLED: 1
  DOCKER_COMPOSE_FILE: ./develop/github/docker-compose.yml

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make bins

  unit-test:
    name: Unit tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      GOMAXPROCS: 2
      TEST_TIMEOUT: 25m
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Select unit test packages
        id: packages
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          {
            go list -tags test_dep -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... |
              grep -v -E '^github.com/superdurable/xtemporal/(tests|common/persistence/tests|tools/tests|temporaltest)(/|$)'
            printf '%s\n' github.com/superdurable/xtemporal/tests/testcore
          } | sort -u | awk -v shard="$SHARD" 'NR % 3 == shard % 3' > unit-packages.txt
          test -s unit-packages.txt
          printf 'packages=%s\n' "$(paste -sd' ' unit-packages.txt)" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: make unit-test UNIT_TEST_DIRS="${{ steps.packages.outputs.packages }}"

  integration-test:
    name: PostgreSQL persistence and schema tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TEST_TIMEOUT: 25m
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start PostgreSQL
        run: docker compose -f "$DOCKER_COMPOSE_FILE" up --detach --wait postgresql
      - name: Run PostgreSQL persistence and schema tests
        run: make integration-test INTEGRATION_TEST_DIRS='./common/persistence/tests ./tools/tests' TEST_ARGS=-run=^Test.*PGX
      - name: Show PostgreSQL logs
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" logs --no-color postgresql
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" down --volumes

  paradedb-persistence-test:
    name: ParadeDB persistence tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PARADEDB_TEST: 1
      POSTGRES_PORT: 55432
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start ParadeDB
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml up --detach --wait paradedb
      - name: Build SQL tool
        run: go build -o /tmp/temporal-sql-tool ./cmd/tools/sql
      - name: Verify full schema setup and versioned update
        run: |
          for database in paradedb_setup paradedb_update; do
            /tmp/temporal-sql-tool --endpoint 127.0.0.1 --port 55432 --user temporal --password temporal --database "$database" --plugin paradedb create-database
          done
          /tmp/temporal-sql-tool --endpoint 127.0.0.1 --port 55432 --user temporal --password temporal --database paradedb_setup --plugin paradedb setup-schema --schema-name paradedb/visibility --version 1.14
          /tmp/temporal-sql-tool --endpoint 127.0.0.1 --port 55432 --user temporal --password temporal --database paradedb_update --plugin paradedb setup-schema --version 0.0
          /tmp/temporal-sql-tool --endpoint 127.0.0.1 --port 55432 --user temporal --password temporal --database paradedb_update --plugin paradedb update-schema --schema-name paradedb/visibility
      - name: Run ParadeDB visibility persistence suite
        run: go test -tags test_dep -timeout 20m -count=1 ./common/persistence/tests -run '^TestParadeDBVisibilityPersistence$'
      - name: Show ParadeDB logs
        if: failure()
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml logs --no-color paradedb
      - name: Stop ParadeDB
        if: always()
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml down --volumes

  functional-test-postgres:
    name: PostgreSQL functional tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      CGO_ENABLED: 1
      PERSISTENCE_TYPE: sql
      PERSISTENCE_DRIVER: postgres12_pgx
      TEST_TOTAL_SHARDS: 3
      TEST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start PostgreSQL
        run: docker compose -f "$DOCKER_COMPOSE_FILE" up --detach --wait postgresql
      - run: go test -tags disable_grpc_modules,test_dep -race -p 2 -timeout 35m -count=1 ./tests -persistenceType=sql -persistenceDriver=postgres12_pgx
      - name: Show PostgreSQL logs
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" logs --no-color postgresql
      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" down --volumes

  functional-test-paradedb:
    name: ParadeDB functional tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      CGO_ENABLED: 1
      POSTGRES_PORT: 55432
      TEST_TOTAL_SHARDS: 3
      TEST_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start ParadeDB
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml up --detach --wait paradedb
      - name: Run functional tests
        run: go test -tags disable_grpc_modules,test_dep -race -p 2 -parallel 4 -timeout 50m -count=1 ./tests -persistenceType=sql -persistenceDriver=paradedb
      - name: Show ParadeDB logs
        if: failure()
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml logs --no-color paradedb
      - name: Stop ParadeDB
        if: always()
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml down --volumes

  advanced-visibility-paradedb:
    name: ParadeDB advanced visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CGO_ENABLED: 1
      POSTGRES_PORT: 55432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start ParadeDB
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml up --detach --wait paradedb
      - name: Run complete advanced visibility suites
        run: go test -tags disable_grpc_modules,test_dep -race -p 2 -parallel 2 -timeout 65m -count=1 ./tests -run '^TestAdvancedVisibilitySuite' -persistenceType=sql -persistenceDriver=paradedb
      - name: Show ParadeDB logs
        if: failure()
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml logs --no-color paradedb
      - name: Stop ParadeDB
        if: always()
        run: docker compose -f develop/docker-compose/paradedb/docker-compose.yml down --volumes

  tests-succeed:
    name: All Tests Succeed
    if: always()
    needs: [build, unit-test, integration-test, paradedb-persistence-test, functional-test-postgres, functional-test-paradedb, advanced-visibility-paradedb]
    runs-on: ubuntu-24.04-arm
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Check results
        run: |
          if jq -e 'all(.[]; . == "success")' <<< "$RESULTS"; then
            exit 0
          fi
          exit 1
