name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: 2
  MAX_TEST_ATTEMPTS: 3
  DOCKER_COMPOSE_FILE: ./develop/github/docker-compose.yml
  TEMPORAL_VERSION_CHECK_DISABLED: 1

jobs:
  unit-test:
    name: Unit tests
    needs:
      - integration-test
    runs-on: ${{ 'linux-dind-heavy' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit tests
        timeout-minutes: 45
        run: ./develop/github/monitor_test.sh make unit-test-coverage

      - name: Publish JUnit report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: ./.testoutput/junit.*.xml
          detailed_summary: true
          check_annotations: false
          annotate_only: true
          skip_annotations: true

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.testoutput/junit.*.xml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  integration-test:
    name: PostgreSQL integration tests
    runs-on: ${{ 'linux-dind-heavy' }}
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: docker compose -f "$DOCKER_COMPOSE_FILE" up --detach --wait postgresql

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run PostgreSQL persistence and schema tests
        timeout-minutes: 25
        env:
          TEST_ARGS: -run=^TestP\(Q\|ostgres\)$$
          INTEGRATION_TEST_DIRS: ./common/persistence/tests ./tools/tests
        run: ./develop/github/monitor_test.sh make integration-test-coverage

      - name: Publish JUnit report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: ./.testoutput/junit.*.xml
          detailed_summary: true
          check_annotations: false
          annotate_only: true
          skip_annotations: true

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-postgres-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.testoutput/junit.*.xml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" down --volumes

  functional-test:
    name: PostgreSQL ${{ matrix.name }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }}
    needs:
      - unit-test
    runs-on: ${{ 'linux-dind-heavy' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: functional
            command: make functional-test-coverage
            timeout: 40
            shard: 0
            total_shards: 3
          - name: functional
            command: make functional-test-coverage
            timeout: 40
            shard: 1
            total_shards: 3
          - name: functional
            command: make functional-test-coverage
            timeout: 40
            shard: 2
            total_shards: 3
    env:
      PERSISTENCE_TYPE: sql
      PERSISTENCE_DRIVER: postgres12
      TEST_TIMEOUT: 35m
      TEST_TOTAL_SHARDS: ${{ matrix.total_shards }}
      TEST_SHARD_INDEX: ${{ matrix.total_shards && matrix.shard || '' }}
      TEMPORAL_TEST_LOG_FILE: ${{ github.workspace }}/.testoutput/debug.log
      TEMPORAL_TEST_LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v6

      - name: Start PostgreSQL
        run: docker compose -f "$DOCKER_COMPOSE_FILE" up --detach --wait postgresql

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run functional test
        timeout-minutes: ${{ matrix.timeout }}
        run: ./develop/github/monitor_test.sh ${{ matrix.command }}

      - name: Dump PostgreSQL logs
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" logs --no-color postgresql

      - name: Publish JUnit report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: ./.testoutput/junit.*.xml
          detailed_summary: true
          check_annotations: false
          annotate_only: true
          skip_annotations: true

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-postgres-${{ matrix.name }}-${{ matrix.shard || 'all' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./.testoutput/junit.*.xml
            ./.testoutput/debug.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" down --volumes

  tests-succeed:
    name: All Tests Succeed
    if: always()
    needs:
      - unit-test
      - integration-test
      - functional-test
    runs-on: ${{ 'linux-dind-light' }}
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Check results
        run: |
          if [[ -n $(echo "$RESULTS" | jq '.[] | select(. != "success")') ]]; then
            exit 1
          fi
