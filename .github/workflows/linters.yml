name: linters
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  lint-actions:
    runs-on: ${{ 'linux-dind-light' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: lint actions
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          make lint-actions
        shell: bash

  lint-protos:
    runs-on: ${{ 'linux-dind-light' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint protobuf definitions
        run: |
          make lint-protos

  lint-api:
    runs-on: ${{ 'linux-dind-light' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint protobuf API definitions
        run: |
          make lint-api

  lint-workflows:
    runs-on: ${{ 'linux-dind-light' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: lint system workflows with workflowcheck
        run: make workflowcheck

  fmt:
    runs-on: ${{ 'linux-dind-light' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: apply formatters
        run: |
          make fmt

      - name: check-is-dirty
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Detected uncommitted changes."
            git status
            git diff
            exit 1
          fi

  parallelize-tests:
    runs-on: ${{ 'linux-dind-light' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: check test parallelization
        run: make parallelize-tests

      - name: check-is-dirty
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Detected uncommitted changes after running parallelize-tests."
            echo "Run 'make parallelize-tests' locally and commit the changes."
            git status
            git diff
            exit 1
          fi

  golangci:
    needs:
      - fmt
      - lint-api
      - lint-protos
      - lint-actions
      - lint-workflows
      - parallelize-tests
    runs-on: ${{ 'linux-dind-light' }}
    env:
      GOMAXPROCS: 1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: lint code
        run: |
          make GOLANGCI_LINT_CONCURRENCY=1 GOLANGCI_LINT_FIX=false GOLANGCI_LINT_BASE_REV=HEAD~ lint-code

      - name: check-is-dirty
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Detected uncommitted changes."
            git status
            git diff
            exit 1
          fi

  linters-succeed:
    name: All Linters Succeed
    needs:
      - fmt
      - lint-api
      - lint-protos
      - lint-actions
      - lint-workflows
      - golangci
      - parallelize-tests
    runs-on: ${{ 'linux-dind-light' }}
    if: always()
    env:
      RESULTS: ${{ toJSON(needs.*.result) }}
    steps:
      - name: Check results
        run: |
          if [[ -n $(echo "$RESULTS" | jq '.[] | select (. != "success")') ]]; then
            exit 1
          fi
