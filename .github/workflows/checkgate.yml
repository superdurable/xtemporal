name: checkgate

on:
  pull_request:

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  required-checks:
    name: required-checks
    runs-on: ${{ 'linux-dind-light' }}
    timeout-minutes: 55
    steps:
      - name: Wait for required checks
        uses: actions/github-script@v8
        with:
          script: |
            const requiredChecks = new Set([
              "All Linters Succeed",
              "All Tests Succeed",
            ]);
            const headSHA = context.payload.pull_request.head.sha;
            const deadline = Date.now() + 50 * 60 * 1000;

            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSHA,
                filter: "latest",
                per_page: 100,
              });
              const checks = data.check_runs.filter((check) => requiredChecks.has(check.name));
              const failed = checks.filter(
                (check) => check.status === "completed" && check.conclusion !== "success",
              );

              if (failed.length > 0) {
                core.setFailed(`Required checks failed: ${failed.map((check) => check.name).join(", ")}`);
                return;
              }

              if (checks.length === requiredChecks.size && checks.every((check) => check.conclusion === "success")) {
                core.info("All required checks passed.");
                return;
              }

              const pending = [...requiredChecks].filter((name) => !checks.some((check) => check.name === name));
              core.info(`Waiting for required checks: ${pending.join(", ") || "running checks"}`);
              await new Promise((resolve) => setTimeout(resolve, 30_000));
            }

            core.setFailed("Timed out waiting for required checks.");
