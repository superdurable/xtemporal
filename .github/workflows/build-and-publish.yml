name: Build and Publish Dex Engine Image

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build temporal-server
        uses: ./.github/actions/build-binaries
        with:
          single-arch: ${{ github.event_name == 'pull_request' && 'amd64' || '' }}

      - name: Build Dex Engine image
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/build-docker-images
        with:
          platform: linux/amd64
          load: true

      - name: Publish Dex Engine image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/build-docker-images
        with:
          push: true
          release-tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check whether this is the current main head
        id: main-head
        if: github.ref == 'refs/heads/main'
        run: |
          remote_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ "${remote_head}" == "${GITHUB_SHA}" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish latest tag
        if: steps.main-head.outputs.current == 'true'
        run: |
          docker buildx imagetools create \
            --tag superdurable/dex-engine-service:latest \
            "superdurable/dex-engine-service:sha-${GITHUB_SHA}"
